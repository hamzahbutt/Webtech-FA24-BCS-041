<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Barrel Fit Jeans - Outfitters Clone</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<main class="container-fluid px-3 px-lg-5 mt-4">
  <h1 class="h4 mb-4">CHECKOUT</h1>

  <form action="#" class="checkout">
    <div class="checkout-grid">

      <fieldset>
        <legend>Contact</legend>

        <div class="field">
          <label for="fullname">Full name</label>
          <input type="text" id="fullname" name="fullname" class="form-control"
                 required minlength="3" placeholder="Hamzah Ahmed">
          <span class="msg">Please enter your full name (min 3 characters).</span>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" class="form-control"
                 required placeholder="you@example.com">
          <span class="msg">Enter a valid email address.</span>
        </div>

        <div class="field">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" name="phone" class="form-control"
                 required pattern="03[0-9]{2}-[0-9]{7}" placeholder="0300-1234567"
                 title="Format: 03XX-XXXXXXX">
          <span class="msg">Use the format 03XX-XXXXXXX.</span>
        </div>
      </fieldset>

      <fieldset>
        <legend>Delivery</legend>

        <div class="field">
          <label for="address">Address</label>
          <input type="text" id="address" name="address" class="form-control"
                 required minlength="5" placeholder="House, street, area">
          <span class="msg">Please enter your delivery address.</span>
        </div>

        <div class="field">
          <label for="city">City</label>
          <select id="city" name="city" class="form-select" required>
            <option value="">Select city</option>
            <option>Lahore</option>
            <option>Islamabad</option>
            <option>Karachi</option>
            <option>Rawalpindi</option>
            <option>Faisalabad</option>
          </select>
          <span class="msg">Please choose a city.</span>
        </div>

        <div class="field">
          <label for="date">Delivery date</label>
          <input type="date" id="date" name="date" class="form-control"
                 required min="2026-10-29" max="2026-12-09">
          <span class="msg">Pick a date from 29 Oct 2026 to 9 Dec 2026.</span>
        </div>
      </fieldset>

    </div>

    <button type="submit" class="btn btn-dark rounded-0 w-100 py-2 mt-4">PLACE ORDER</button>
  </form>
</main>
